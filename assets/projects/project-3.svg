<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181716"/>
      <stop offset="50%" stop-color="#24211e"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24211e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#161514" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad3)"/>

  <!-- Architectural Isometric Lines Pattern -->
  <path d="M0 80 L800 480 M0 200 L800 600 M-200 0 L600 400" stroke="#d4af37" stroke-width="0.6" opacity="0.12" fill="none"/>

  <!-- Browser Window Mockup -->
  <g filter="url(#shadow3)">
    <rect x="40" y="35" width="720" height="430" rx="12" fill="url(#cardGrad3)" stroke="#3e3832" stroke-width="1.5"/>

    <!-- Browser Header Bar -->
    <rect x="40" y="35" width="720" height="42" rx="12" fill="#141312"/>
    <rect x="40" y="65" width="720" height="12" fill="#141312"/>

    <!-- Window Dots -->
    <circle cx="68" cy="56" r="6" fill="#ef4444"/>
    <circle cx="88" cy="56" r="6" fill="#f59e0b"/>
    <circle cx="108" cy="56" r="6" fill="#10b981"/>

    <!-- Address Bar -->
    <rect x="140" y="44" width="410" height="24" rx="6" fill="#24211e" stroke="#3e3832" stroke-width="1"/>
    <path d="M155 56 L157 58 L163 52" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="175" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a8a29e">vinayaligam-source.github.io/interior-design-website</text>

    <!-- Top Badge Mockup -->
    <text x="690" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d4af37" text-anchor="end">LUXURY STUDIO</text>
  </g>

  <!-- Website Content Preview -->
  <!-- Studio Tag -->
  <rect x="75" y="105" width="185" height="26" rx="13" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-opacity="0.4"/>
  <circle cx="90" cy="118" r="4" fill="#d4af37"/>
  <text x="102" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f3e5ab" letter-spacing="1">ARCHITECTURE &amp; LIVING</text>

  <!-- Main Headline -->
  <text x="75" y="170" font-family="'Georgia', serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Interior Creative Design</text>
  <text x="75" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#d4af37">Luxury Architecture &amp; Interior Studio</text>
  <text x="75" y="233" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a8a29e">Where Timeless Elegance Meets Thoughtful Contemporary Design</text>

  <!-- Design Category Tags -->
  <g transform="translate(75, 260)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#24211e" stroke="#443e37" stroke-width="1"/>
    <text x="65" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7e5e4" font-weight="600" text-anchor="middle">Modular Kitchen</text>

    <rect x="140" y="0" width="125" height="28" rx="6" fill="#24211e" stroke="#443e37" stroke-width="1"/>
    <text x="202" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7e5e4" font-weight="600" text-anchor="middle">Luxury Bedroom</text>

    <rect x="275" y="0" width="120" height="28" rx="6" fill="#24211e" stroke="#443e37" stroke-width="1"/>
    <text x="335" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7e5e4" font-weight="600" text-anchor="middle">Living Spaces</text>

    <rect x="405" y="0" width="105" height="28" rx="6" fill="#24211e" stroke="#443e37" stroke-width="1"/>
    <text x="457" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e7e5e4" font-weight="600" text-anchor="middle">Commercial</text>
  </g>

  <!-- Project Stats Row -->
  <g transform="translate(75, 315)">
    <rect x="0" y="0" width="190" height="65" rx="8" fill="#1c1a18" stroke="#3e3832"/>
    <text x="18" y="28" font-family="'Georgia', serif" font-size="20" font-weight="700" fill="#d4af37">Modern UI</text>
    <text x="18" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a8a29e">Interactive Gallery &amp; Layout</text>

    <rect x="205" y="0" width="200" height="65" rx="8" fill="#1c1a18" stroke="#3e3832"/>
    <text x="223" y="28" font-family="'Georgia', serif" font-size="20" font-weight="700" fill="#f59e0b">GitHub Live</text>
    <text x="223" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a8a29e">Deployed &amp; Fully Responsive</text>
  </g>

  <!-- Right Graphic Illustration (Interior Frame Architecture visual) -->
  <g transform="translate(530, 115)">
    <rect x="0" y="0" width="190" height="265" rx="10" fill="#141312" stroke="#3e3832" stroke-width="1.5"/>
    <!-- Room perspective visual -->
    <polygon points="25,45 165,45 145,175 45,175" fill="#24211e" stroke="#d4af37" stroke-width="1"/>
    <line x1="45" y1="175" x2="25" y2="205" stroke="#d4af37" stroke-width="1"/>
    <line x1="145" y1="175" x2="165" y2="205" stroke="#d4af37" stroke-width="1"/>
    <!-- Pendant light hanging -->
    <line x1="95" y1="45" x2="95" y2="95" stroke="#d4af37" stroke-width="1.5"/>
    <polygon points="85,115 105,115 95,95" fill="#d4af37"/>
    <!-- Label -->
    <rect x="25" y="220" width="140" height="26" rx="13" fill="#d4af37" fill-opacity="0.2"/>
    <text x="95" y="237" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f3e5ab" text-anchor="middle">CREATIVE PORTFOLIO</text>
  </g>

  <!-- Live Link Button in Preview -->
  <g transform="translate(75, 400)">
    <rect x="0" y="0" width="145" height="34" rx="17" fill="url(#goldGrad)"/>
    <text x="60" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#141312" text-anchor="middle">EXPLORE SITE</text>
    <path d="M115 17 L122 17 M119 14 L122 17 L119 20" stroke="#141312" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
